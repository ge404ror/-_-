plugins {
    id "com.android.application"
}

android {
    namespace "com.lastfrequency.player"
    compileSdk 35

    defaultConfig {
        applicationId "com.lastfrequency.player"
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName "1.4"
    }

    packaging {
        jniLibs { useLegacyPackaging = true }
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "x86_64"
            universalApk false
        }
    }
}

dependencies {
    implementation "io.github.junkfood02.youtubedl-android:library:0.18.1"
    implementation "io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1"
}
